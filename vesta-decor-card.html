<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کارت ویزیت دیجیتال - وستا دکور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    font-family:'Vazirmatn', sans-serif;
    background:#08090B;
    overflow:hidden;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }

  .bg{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(circle at 18% 12%, rgba(180,185,195,0.16), transparent 42%),
      radial-gradient(circle at 88% 85%, rgba(90,95,105,0.28), transparent 48%),
      radial-gradient(circle at 75% 8%, rgba(255,255,255,0.06), transparent 40%),
      linear-gradient(160deg, #08090B 0%, #16181C 50%, #08090B 100%);
  }
  .blob{
    position:fixed; border-radius:50%;
    filter:blur(65px); opacity:0.45; z-index:0;
    animation:float 13s ease-in-out infinite;
  }
  .b1{width:260px; height:260px; background:#6b7280; top:-70px; right:-60px; animation-delay:0s;}
  .b2{width:220px; height:220px; background:#2a2d33; bottom:-50px; left:-60px; animation-delay:2.2s;}
  .b3{width:170px; height:170px; background:#c9cdd3; top:42%; left:-90px; opacity:0.14; animation-delay:4.2s;}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(15px,-20px) scale(1.08);}
  }

  .particle{
    position:fixed; border-radius:50%;
    background:rgba(255,255,255,0.5);
    z-index:1; pointer-events:none;
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{transform:translateY(0) translateX(0); opacity:0;}
    10%{opacity:0.55;}
    90%{opacity:0.35;}
    100%{transform:translateY(-620px) translateX(20px); opacity:0;}
  }

  .card{
    position:relative; z-index:2;
    width:346px;
    padding:32px 26px 24px;
    border-radius:28px;
    background:rgba(255,255,255,0.055);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    border:1px solid rgba(255,255,255,0.13);
    box-shadow:
      0 8px 40px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.18);
    color:#fff;
    text-align:center;
  }
  .card::before{
    content:"";
    position:absolute; inset:0; border-radius:28px;
    padding:1px;
    background:linear-gradient(135deg, rgba(210,213,218,0.55), transparent 40%, transparent 60%, rgba(210,213,218,0.3));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    pointer-events:none;
  }
  .shine{
    position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(115deg, transparent, rgba(255,255,255,0.10), transparent);
    animation:sweep 5s ease-in-out infinite; pointer-events:none;
  }
  @keyframes sweep{
    0%{left:-60%;}
    40%{left:130%;}
    100%{left:130%;}
  }

  .logo-wrap{
    width:88px; height:88px; margin:0 auto 14px;
    border-radius:22px;
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(255,255,255,0.3);
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    overflow:hidden;
  }
  .logo-wrap img{width:72%; height:72%; object-fit:contain;}

  .name{font-size:21px; font-weight:800; margin-bottom:4px; letter-spacing:0.2px;}
  .role{
    font-size:12px; color:#C7CAD0; font-weight:500; margin-bottom:16px;
    letter-spacing:0.2px; line-height:1.9;
  }
  .divider{
    width:40px; height:2px; margin:0 auto 18px;
    background:linear-gradient(90deg, transparent, #c9cdd3, transparent);
  }

  .actions{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    margin-bottom:12px;
  }
  .act{
    display:flex; align-items:center; justify-content:center; gap:6px;
    padding:11px 6px; border-radius:14px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    color:#fff; font-size:12px; font-weight:600;
    text-decoration:none;
    transition:transform .2s, background .2s;
  }
  .act:active{transform:scale(0.96); background:rgba(200,205,212,0.22);}
  .act .ic{font-size:14px; display:flex; align-items:center; justify-content:center;}
  .act svg{width:16px; height:16px; flex-shrink:0;}

  .primary-act{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:13px; border-radius:16px; margin-top:6px;
    background:linear-gradient(135deg,#3a3d43,#1b1d21);
    border:1px solid rgba(255,255,255,0.18);
    color:#fff; font-size:13px; font-weight:700;
    text-decoration:none;
    box-shadow:0 6px 20px rgba(0,0,0,0.4);
  }

  .footer-note{
    margin-top:16px; font-size:10px; color:rgba(255,255,255,0.32);
    letter-spacing:0.5px;
  }
</style>
</head>
